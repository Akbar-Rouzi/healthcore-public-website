              <textarea class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-teal block w-full min-w-0 rounded-lg border border-[#e8edf4] bg-white p-3 text-base text-slate-700 placeholder:text-slate-500 placeholder:opacity-100 sm:text-sm min-h-[130px] resize-y leading-[1.8]" id="health-concern" name="health_concern" rows="4" aria-required="true" aria-describedby="concern-help concern-counter" data-i18n-placeholder="application.concern.placeholder" placeholder=""></textarea>
              <p id="concern-help" class="mt-[7px] text-xs leading-[1.7] text-slate-500"><span data-i18n="application.concern.help"></span></p>
            </div>
            <aside class="mt-[18px] flex items-start gap-3 rounded-lg bg-[#fff0f1] p-4 text-xs leading-[1.8] text-[#b4232c]">
              <i data-lucide="asterisk" class="size-5 shrink-0" aria-hidden="true"></i>
              <p><strong><span data-i18n="application.emergency.title"></span></strong> <span data-i18n="application.emergency.before"></span> <a href="tel:911" class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-teal font-bold underline">911</a> <span data-i18n="application.emergency.after"></span></p>
            </aside>
          </section>

          <label class="mt-11 flex cursor-pointer items-start gap-3 text-xs leading-[1.8]" for="contact-consent">
            <input class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-teal size-5 shrink-0 accent-teal mt-0.5" id="contact-consent" name="contact_consent" type="checkbox" value="Yes" aria-required="true" />
            <span><span data-i18n="application.consent"></span> <span class="text-[#c92935]" aria-hidden="true">*</span></span>
          </label>
          <div class="mt-7 flex flex-col items-stretch justify-between gap-4 sm:flex-row sm:items-center sm:gap-6">
            <p id="submission-note" class="max-w-[380px] text-xs leading-[1.8] text-slate-500"><span data-i18n="application.submission.note"></span></p>
            <button type="submit" class="focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-teal flex min-h-12 shrink-0 items-center justify-center gap-2.5 rounded-md bg-navy px-7 py-3 text-sm font-extrabold text-white hover:bg-[#1c466f] cursor-pointer" aria-describedby="submission-note"><span data-i18n="application.submission.button"></span> <i data-lucide="arrow-right" class="size-4" aria-hidden="true"></i></button>
          </div>
          <dialog id="submission-status" class="m-auto max-h-[calc(100dvh-32px)] w-[calc(100%-32px)] max-w-xl overflow-y-auto rounded-2xl border border-mint bg-white p-6 text-sm leading-7 text-navy shadow-2xl backdrop:bg-navy/60 sm:p-8" aria-labelledby="confirmation-heading" aria-describedby="confirmation-description">
            <button id="close-confirmation" type="button" autofocus data-i18n-aria-label="application.confirmation.close" aria-label="" class="mb-3 ml-auto flex size-11 items-center justify-center rounded-full text-navy hover:bg-cloud focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal"><i data-lucide="x" class="size-5" aria-hidden="true"></i></button>
            <h2 id="confirmation-heading" class="text-lg font-extrabold"><span data-i18n="application.confirmation.title"></span></h2>
            <p id="confirmation-description" class="mt-3"><span data-i18n="application.confirmation.description"></span></p>
            <p class="mt-3"><span data-i18n="application.confirmation.urgent"></span></p>
            <p class="mt-3"><span data-i18n="application.confirmation.closing"></span></p>
          </dialog>
        </form>

        <aside class="order-last mt-8 flex items-start gap-4 rounded-xl border border-transparent bg-[#f0f4ff] p-5 sm:order-first sm:mb-4 sm:mt-0 sm:items-center sm:border-[#dfe8fc] sm:p-6" aria-labelledby="partnership-heading">
          <span class="grid size-9 shrink-0 place-items-center rounded-full bg-blue-100 text-navy"><i data-lucide="building-2" class="size-5" aria-hidden="true"></i></span>
          <div>
            <h2 id="partnership-heading" class="text-sm font-extrabold text-navy"><span data-i18n="application.partnership.title"></span></h2>
            <p class="mt-1 text-xs leading-6"><span data-i18n="application.partnership.description"></span>
              <a class="mt-3 block font-extrabold text-[#087e98] underline [overflow-wrap:anywhere] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-teal sm:mt-0 sm:inline" href="mailto:partnerships@healthcore.com">partnerships@healthcore.com ↗</a>
            </p>
          </div>
        </aside>
      </div>
    </main>
    <div id="footer"></div>
    <script type="module" src="./js/components.js"></script>
  </body>
</html>
