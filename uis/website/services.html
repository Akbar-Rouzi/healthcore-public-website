<!doctype html>
<html lang="en" data-translatable-page data-page-state="loading">

<head>
  <meta charset="UTF-8" />
    <style>
      html:not([data-page-state="ready"]) body > :not(#page-status):not(noscript):not(script) { display: none !important; }
    </style>
    <link rel="stylesheet" href="./css/page-loading.css" />
    <script src="./js/page-loading.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="services.meta.title">HealthCore</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-white font-sans text-slate-700">
    <div id="page-status" role="status" aria-live="polite" aria-atomic="true">
      <p id="page-status-message"><span lang="en">Loading ...</span><span lang="es">Cargando...</span></p>
      <a id="page-retry" href="" hidden><span lang="en">Retry</span><span lang="es">Reintentar</span></a>
    </div>
    <noscript>
      <style>#page-status { display: none; }</style>
      <div class="page-noscript"><span lang="en">Please enable JavaScript to view this page.</span><span lang="es">Activa JavaScript para ver esta p&aacute;gina.</span></div>
    </noscript>
  <!-- Shared header -->
  <div id="header" class="sticky top-0 z-50"></div>
  <main id="main-content" tabindex="-1" class="flex-1 bg-[#f7f8fd]">
    <!-- Page introduction -->
    <section class="mx-auto max-w-7xl px-5 pb-14 pt-14 md:px-8 md:pb-20 md:pt-16">
      <p
        class="inline-flex items-center gap-2 rounded-full bg-blue-100 px-4 py-2 text-xs font-bold uppercase text-teal">
        <i data-lucide="badge-check" class="size-4" aria-hidden="true"></i>
        <span data-i18n="services.intro.badge"></span>
      </p>

      <h1 class="mt-5 max-w-3xl text-4xl font-extrabold leading-tight text-navy md:text-5xl">
        <span data-i18n="services.intro.title"></span>
      </h1>

      <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-600">
        <span data-i18n="services.intro.description"></span>
      </p>
    </section>

    <!-- Services and Why HealthCore sections will go here -->
    <!-- Services -->
    <section class="mx-auto max-w-7xl px-5 pb-24 md:px-8 md:pb-28" aria-labelledby="services-heading">
      <div class="mb-10">
        <p class="text-xs font-bold uppercase text-teal">
          <span data-i18n="services.departments.label"></span>
        </p>

        <h2 id="services-heading" class="mt-3 text-3xl font-extrabold text-navy md:text-4xl">
          <span data-i18n="services.departments.title"></span>
        </h2>
      </div>

      <div class="grid gap-6 lg:grid-cols-3">
        <!-- Primary Care -->
        <article
          class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm md:grid md:grid-cols-[35%_65%] lg:flex lg:flex-col">
          <div class="relative min-h-52 md:min-h-full lg:min-h-0">
            <picture>
              <source media="(min-width: 768px) and (max-width: 1023.98px)"
                srcset="public/images/primary-care-tablet.jpg" />
              <img src="public/images/primary-care.jpg"
                data-i18n-alt="services.primary.imageAlt" alt="" width="329" height="140"
                class="absolute inset-0 h-full w-full object-cover object-center lg:static lg:aspect-[16/7]" />
            </picture>
            <p
              class="absolute bottom-4 left-4 rounded bg-white px-4 py-2 text-[10px] font-extrabold uppercase text-navy shadow-sm">
              <span data-i18n="services.primary.label"></span>
            </p>
          </div>

          <div class="flex min-w-0 flex-1 flex-col">
            <div class="flex-1 p-7 md:p-5 lg:p-7">
              <span class="grid size-12 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="stethoscope" class="size-6" aria-hidden="true"></i>
              </span>

              <h3 class="mt-5 text-2xl font-bold text-navy md:text-xl min-[900px]:text-2xl">
                <span data-i18n="services.primary.title"></span>
              </h3>
              <p class="mt-4 leading-7 text-slate-600">
                <span data-i18n="services.primary.description"></span>
              </p>
            </div>

            <ul class="space-y-4 bg-cloud p-7 md:p-5 lg:p-7">
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.primary.appointments"></span></span>
              </li>
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.primary.conditions"></span></span>
              </li>
            </ul>
          </div>
        </article>

        <!-- Specialist Consultations -->
        <article
          class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm md:grid md:grid-cols-[35%_65%] lg:flex lg:flex-col">
          <div class="relative min-h-52 md:min-h-full lg:min-h-0">
            <picture>
              <source media="(min-width: 768px) and (max-width: 1023.98px)"
                srcset="public/images/specialist-care-tablet.jpg" />
              <img src="public/images/specialist-care.jpg"
                data-i18n-alt="services.specialist.imageAlt" alt="" width="330" height="140"
                class="absolute inset-0 h-full w-full object-cover object-center lg:static lg:aspect-[16/7]" />
            </picture>
            <p
              class="absolute bottom-4 left-4 rounded bg-white px-4 py-2 text-[10px] font-extrabold uppercase text-navy shadow-sm">
              <span data-i18n="services.specialist.label"></span>
            </p>
          </div>

          <div class="flex min-w-0 flex-1 flex-col">
            <div class="flex-1 p-7 md:p-5 lg:p-7">
              <span class="grid size-12 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="notebook-tabs" class="size-6" aria-hidden="true"></i>
              </span>

              <h3 class="mt-5 text-2xl font-bold text-navy md:text-xl min-[900px]:text-2xl">
                <span data-i18n="services.specialist.title"></span>
              </h3>
              <p class="mt-4 leading-7 text-slate-600">
                <span data-i18n="services.specialist.description"></span>
              </p>
            </div>

            <ul class="space-y-4 bg-cloud p-7 md:p-5 lg:p-7">
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.specialist.specialties"></span></span>
              </li>
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.specialist.referrals"></span></span>
              </li>
            </ul>
          </div>
        </article>

        <!-- Preventive Health -->
        <article
          class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm md:grid md:grid-cols-[35%_65%] lg:flex lg:flex-col">
          <div class="relative min-h-52 md:min-h-full lg:min-h-0">
            <picture>
              <source media="(min-width: 768px) and (max-width: 1023.98px)"
                srcset="public/images/preventive-care-tablet.jpg" />
              <img src="public/images/preventive-care.jpg"
                data-i18n-alt="services.preventive.imageAlt" alt="" width="329" height="140"
                class="absolute inset-0 h-full w-full object-cover object-center lg:static lg:aspect-[16/7]" />
            </picture>
            <p
              class="absolute bottom-4 left-4 rounded bg-white px-4 py-2 text-[10px] font-extrabold uppercase text-navy shadow-sm">
              <span data-i18n="services.preventive.label"></span>
            </p>
          </div>

          <div class="flex min-w-0 flex-1 flex-col">
            <div class="flex-1 p-7 md:p-5 lg:p-7">
              <span class="grid size-12 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="shield-check" class="size-6" aria-hidden="true"></i>
              </span>

              <h3 class="mt-5 text-2xl font-bold text-navy md:text-xl min-[900px]:text-2xl">
                <span data-i18n="services.preventive.title"></span>
              </h3>
              <p class="mt-4 leading-7 text-slate-600">
                <span data-i18n="services.preventive.description"></span>
              </p>
            </div>

            <ul class="space-y-4 bg-cloud p-7 md:p-5 lg:p-7">
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.preventive.screenings"></span></span>
              </li>
              <li class="flex gap-3">
                <i data-lucide="circle-check" class="mt-1 size-5 shrink-0 text-teal" aria-hidden="true"></i>
                <span><span data-i18n="services.preventive.mentalHealth"></span></span>
              </li>
            </ul>
          </div>
        </article>
      </div>
    </section>

    <!-- Why HealthCore -->
    <section class="mx-auto max-w-7xl px-5 pb-24 md:px-8 md:pb-32" aria-labelledby="why-healthcore-heading">
      <div
        class="rounded-2xl bg-[#eef3ff] bg-[radial-gradient(ellipse_at_top_left,#e1eaff,transparent_45%),radial-gradient(ellipse_at_bottom_right,#d9f1ff,transparent_45%)] p-8 md:p-10 lg:p-16">
        <div class="grid items-center gap-10 lg:grid-cols-[0.85fr_1.15fr] lg:gap-12">
          <!-- Introduction -->
          <div>
            <p class="text-xs font-bold uppercase tracking-widest text-teal">
              <span data-i18n="services.why.label"></span>
            </p>

            <h2 id="why-healthcore-heading" class="mt-4 text-3xl font-extrabold text-navy md:text-4xl">
              <span data-i18n="services.why.title"></span>
            </h2>

            <p class="mt-6 leading-8 text-slate-600">
              <span data-i18n="services.why.description"></span>
            </p>

            <!-- Care continuity metric -->
            <div class="mt-6 flex items-center gap-4 rounded-xl bg-white p-4 shadow-sm md:gap-6 md:p-5">
              <div class="relative size-16 shrink-0">
                <svg viewBox="0 0 64 64" class="size-full rotate-[150deg]" aria-hidden="true">
                  <circle cx="32" cy="32" r="27" fill="none" stroke="#e2e8f0" stroke-width="5" />
                  <circle cx="32" cy="32" r="27" fill="none" stroke="#00738c" stroke-width="5" stroke-linecap="round"
                    pathLength="100" stroke-dasharray="94 100" />
                </svg>

                <span class="absolute inset-0 grid place-items-center text-lg font-extrabold text-navy">
                  <span data-i18n="services.continuity.value"></span>
                </span>
              </div>

              <div class="min-w-0">
                <h3 class="text-sm font-extrabold text-navy">
                  <span data-i18n="services.continuity.title"></span>
                </h3>
                <p class="mt-1 text-xs leading-5 text-slate-600">
                  <span data-i18n="services.continuity.description"></span>
                </p>
              </div>
            </div>
          </div>

          <!-- Benefits -->
          <div class="grid gap-4 md:grid-cols-2">
            <article class="flex flex-col rounded-xl bg-white p-6 shadow-sm">
              <span class="grid size-10 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="calendar-check" class="size-5" aria-hidden="true"></i>
              </span>

              <p class="mt-6 text-[10px] font-bold uppercase tracking-wide text-teal lg:mt-auto lg:pt-5">
                <span data-i18n="services.benefits.access.label"></span>
              </p>
              <h3 class="mt-2 text-base font-extrabold leading-6 text-navy">
                <span data-i18n="services.benefits.access.title"></span>
              </h3>
            </article>

            <article class="flex flex-col rounded-xl bg-white p-6 shadow-sm">
              <span class="grid size-10 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="clock" class="size-5" aria-hidden="true"></i>
              </span>

              <p class="mt-6 text-[10px] font-bold uppercase tracking-wide text-teal lg:mt-auto lg:pt-5">
                <span data-i18n="services.benefits.hours.label"></span>
              </p>
              <h3 class="mt-2 text-base font-extrabold leading-6 text-navy">
                <span data-i18n="services.benefits.hours.title"></span>
              </h3>
            </article>

            <article class="flex flex-col rounded-xl bg-white p-6 shadow-sm">
              <span class="grid size-10 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="languages" class="size-5" aria-hidden="true"></i>
              </span>

              <p class="mt-6 text-[10px] font-bold uppercase tracking-wide text-teal lg:mt-auto lg:pt-5">
                <span data-i18n="services.benefits.bilingual.label"></span>
              </p>
              <h3 class="mt-2 text-base font-extrabold leading-6 text-navy">
                <span data-i18n="services.benefits.bilingual.title"></span>
              </h3>
            </article>

            <article class="flex flex-col rounded-xl bg-white p-6 shadow-sm">
              <span class="grid size-10 place-items-center rounded-lg bg-cloud text-navy">
                <i data-lucide="map-pin" class="size-5" aria-hidden="true"></i>
              </span>

              <p class="mt-6 text-[10px] font-bold uppercase tracking-wide text-teal lg:mt-auto lg:pt-5">
                <span data-i18n="services.benefits.locations.label"></span>
              </p>
              <h3 class="mt-2 text-base font-extrabold leading-6 text-navy">
                <span data-i18n="services.benefits.locations.title"></span>
              </h3>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared footer -->
  <div id="footer"></div>

  <!-- Shared component behavior -->
  <script type="module" src="./js/components.js"></script>
</body>

</html>
