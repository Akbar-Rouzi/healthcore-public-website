  <!-- Open Graph -->
  <meta property="og:title" data-i18n-content="home.meta.title" content="" />
  <meta
    property="og:description"
    data-i18n-content="home.meta.description" content=""

  <meta property="og:url" content="https://www.healthcore.com/" />

    property="og:image"
    content="https://www.healthcore.com/public/images/home-hero.jpg"
  />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- JSON-LD structured data for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "HealthCore",
      "description": "Outpatient healthcare network offering primary care, specialist consultations, chronic disease management, and preventive health programmes.",
      "url": "https://www.healthcore.com",
      "foundingDate": "2011",
      "logo": "https://www.healthcore.com/logo.png",
      "availableLanguage": ["English", "Spanish"],
      "areaServed": ["US", "GB"],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Austin",
        "addressRegion": "Texas",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-512-340-8800",
        "contactType": "patient services",
        "availableLanguage": ["English", "Spanish"]
      },
      "sameAs": [
        "https://linkedin.com/company/healthcore",
        "https://facebook.com/healthcore",
        "https://instagram.com/healthcore"
      ]
    }
  </script>
</head>

<body class="bg-white font-sans text-slate-700">
    <div id="page-status" role="status" aria-live="polite" aria-atomic="true">
      <p id="page-status-message"><span lang="en">Loading ...</span><span lang="es">Cargando...</span></p>
      <a id="page-retry" href="" hidden><span lang="en">Retry</span><span lang="es">Reintentar</span></a>
    </div>
    <noscript>
      <style>#page-status { display: none; }</style>
      <div class="page-noscript"><span lang="en">Please enable JavaScript to view this page.</span><span lang="es">Activa JavaScript para ver esta p&aacute;gina.</span></div>
    </noscript>
  <!-- Header -->
  <div id="header" class="sticky top-0 z-50"></div>

  <main class="home-page">
    <section class="home-hero home-container" aria-labelledby="hero-heading">
      <div class="home-hero-copy">
        <p class="home-badge"><span aria-hidden="true"></span><span data-i18n="home.hero.badge"></span></p>
        <h1 id="hero-heading"><span data-i18n="home.hero.title"></span></h1>
        <p class="home-hero-description"><span data-i18n="home.hero.description"></span></p>
        <div class="home-actions">
          <a href="application.html" class="home-button home-button-primary"><span data-i18n="common.requestAppointment"></span><i data-lucide="arrow-right" aria-hidden="true"></i></a>
          <a href="locations.html" class="home-button home-button-secondary"><span data-i18n="home.hero.locations"></span><i data-lucide="map-pin" aria-hidden="true"></i></a>
        </div>
      </div>
      <div class="home-hero-media">
        <img src="public/images/home-hero.jpg" data-i18n-alt="home.hero.imageAlt" alt="" width="1200" height="896" fetchpriority="high" />
        <article class="home-accreditation">
          <div class="home-accreditation-icon"><i data-lucide="shield-check" aria-hidden="true"></i></div>
          <div class="home-accreditation-copy"><h2><span data-i18n="home.accreditation.title"></span></h2><p><span data-i18n="home.accreditation.description"></span></p></div>
          <div class="home-rating" role="img" data-i18n-aria-label="home.accreditation.rating"><i data-lucide="star" aria-hidden="true"></i><i data-lucide="star" aria-hidden="true"></i><i data-lucide="star" aria-hidden="true"></i><i data-lucide="star" aria-hidden="true"></i><i data-lucide="star" aria-hidden="true"></i></div>
        </article>
      </div>
    </section>

      <p class="home-eyebrow"><span data-i18n="home.services.label"></span></p>
      <h2 id="services-heading" class="home-section-title"><span data-i18n="home.services.title"></span></h2>
      <div class="home-services-grid">
        <article class="home-service-card">
          <div class="home-service-icon"><i data-lucide="clock-3" aria-hidden="true"></i></div>
          <h3><span data-i18n="services.primary.title"></span></h3>
          <ul><li><span data-i18n="services.primary.appointments"></span></li><li><span data-i18n="services.primary.conditions"></span></li></ul>
          <p class="home-service-category"><span data-i18n="home.services.primary.category"></span></p>
        </article>
<article class="home-service-card">
          <div class="home-service-icon"><i data-lucide="flask-conical" aria-hidden="true"></i></div>
          <h3><span data-i18n="services.specialist.title"></span></h3>
          <ul><li><span data-i18n="services.specialist.specialties"></span></li><li><span data-i18n="services.specialist.referrals"></span></li></ul>
          <p class="home-service-category"><span data-i18n="home.services.specialist.category"></span></p>
        </article>
<article class="home-service-card">
          <div class="home-service-icon"><i data-lucide="shield-check" aria-hidden="true"></i></div>
          <h3><span data-i18n="services.preventive.title"></span></h3>
          <ul><li><span data-i18n="services.preventive.screenings"></span></li><li><span data-i18n="services.preventive.mentalHealth"></span></li></ul>
          <p class="home-service-category"><span data-i18n="home.services.preventive.category"></span></p>
        </article>
      </div>
    </section>

    <section class="home-why home-container" aria-labelledby="benefits-heading">
      <p class="home-eyebrow"><span data-i18n="home.benefits.label"></span></p>
      <h2 id="benefits-heading" class="home-section-title"><span data-i18n="home.benefits.title"></span></h2>
      <div class="home-benefits-grid">
        <article class="home-benefit-card">
          <div class="home-benefit-icon"><i data-lucide="clock-3" aria-hidden="true"></i></div>
          <div><h3><span data-i18n="home.benefits.sameDay.title"></span></h3><p><span data-i18n="home.benefits.sameDay.description"></span></p></div>
        </article>
<article class="home-benefit-card">
          <div class="home-benefit-icon"><i data-lucide="calendar-days" aria-hidden="true"></i></div>
          <div><h3><span data-i18n="home.benefits.hours.title"></span></h3><p><span data-i18n="home.benefits.hours.description"></span></p></div>
        </article>
<article class="home-benefit-card">
          <div class="home-benefit-icon"><i data-lucide="languages" aria-hidden="true"></i></div>
          <div><h3><span data-i18n="home.benefits.bilingual.title"></span></h3><p><span data-i18n="home.benefits.bilingual.description"></span></p></div>
        </article>
<article class="home-benefit-card">
          <div class="home-benefit-icon"><i data-lucide="globe-2" aria-hidden="true"></i></div>
          <div><h3><span data-i18n="home.benefits.locations.title"></span></h3><p><span data-i18n="home.benefits.locations.description"></span></p></div>

        <div><h2 id="contact-heading"><span data-i18n="home.contact.title"></span></h2><p><span data-i18n="home.contact.description"></span></p></div>
        <div class="home-actions">
          <a href="locations.html" class="home-button home-button-outline"><span data-i18n="home.hero.locations"></span><i data-lucide="map-pin" aria-hidden="true"></i></a>
          <a href="application.html" class="home-button home-button-light"><span data-i18n="home.contact.submit"></span><i data-lucide="arrow-right" aria-hidden="true"></i></a>
