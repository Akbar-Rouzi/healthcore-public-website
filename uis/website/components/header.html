<header class="border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-5 lg:px-8">
    <a href="index.html" class="flex shrink-0 items-center gap-2" aria-label="HealthCore home">
      <span class="grid size-8 shrink-0 place-items-center rounded-md bg-navy text-white sm:size-9">
        <i data-lucide="plus" class="size-5 stroke-[3]" aria-hidden="true"></i>
      </span>

      <span class="flex flex-col leading-none">
        <span class="whitespace-nowrap text-sm font-extrabold sm:text-base">
          <span class="text-navy">Health</span><span class="text-teal">Core</span>
        </span>

        <span
          class="mt-1 whitespace-nowrap text-[6px] font-bold uppercase tracking-wide text-slate-500 sm:text-[7px]"
        >
          Outpatient Healthcare
        </span>
      </span>
    </a>

    <nav class="hidden items-center gap-8 lg:flex" aria-label="Primary navigation">
      <a href="index.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        Home
      </a>
      <a href="services.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        Services
      </a>
      <a href="locations.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        Locations
      </a>
      <a href="contact.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        Contact
      </a>
    </nav>

    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex shrink-0 rounded-md bg-[#eef3ff] p-1" role="group" aria-label="Language selection">
        <button type="button" class="min-h-8 rounded bg-navy px-2 text-xs font-bold text-white sm:px-3" aria-label="English" aria-pressed="true">
          EN
        </button>
        <button type="button" class="min-h-8 rounded px-2 text-xs font-bold text-slate-600 sm:px-3" aria-label="Spanish" aria-pressed="false">
          ES
        </button>
      </div>

      <a
        href="application.html"
        class="grid size-10 place-items-center rounded-full bg-navy text-white"
        aria-label="Open patient application"
      >
        <i data-lucide="user-round" class="size-5" aria-hidden="true"></i>
      </a>

      <button
        type="button"
        id="menu-button"
        class="grid size-10 place-items-center rounded-md text-navy hover:bg-slate-100 lg:hidden"
        aria-label="Open navigation menu"
        aria-controls="mobile-menu"
        aria-expanded="false"
      >
        <i data-lucide="menu" class="size-6" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <nav
    id="mobile-menu"
    class="hidden border-t border-slate-200 bg-white px-4 pb-4 pt-3 lg:hidden"
    aria-label="Mobile and tablet navigation"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-1">
      <a href="index.html" data-nav-link class="rounded-md px-3 py-3 font-semibold hover:bg-cloud">
        Home
      </a>
      <a href="services.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        Services
      </a>
      <a href="locations.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        Locations
      </a>
      <a href="contact.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        Contact
      </a>
    </div>
  </nav>
</header>
