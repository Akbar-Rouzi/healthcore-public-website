<header class="border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex h-[100px] max-w-[1600px] items-center justify-between gap-3 px-[30px] max-[374px]:gap-1 max-[374px]:px-4 sm:h-[120px] lg:grid lg:grid-cols-[1fr_auto_1fr] lg:gap-8 xl:px-[60px]">
    <a href="index.html" class="flex shrink-0 items-center gap-2 justify-self-start" data-i18n-aria-label="header.home">
      <span class="grid size-11 max-[374px]:size-9 shrink-0 place-items-center rounded-md bg-navy text-white sm:size-12">
        <i data-lucide="plus" class="size-6 stroke-[3]" aria-hidden="true"></i>
      </span>

      <span class="flex flex-col leading-none">
        <span class="whitespace-nowrap text-lg max-[374px]:text-sm font-extrabold sm:text-2xl">
          <span class="text-navy">Health</span><span class="text-teal">Core</span>
        </span>

        <span
          class="mt-1 whitespace-nowrap text-[8px] max-[374px]:text-[6px] font-bold uppercase tracking-wide text-slate-500 sm:text-[10px]"
        >
          <span data-i18n="header.tagline"></span>
        </span>
      </span>
    </a>

    <nav class="hidden items-center gap-8 lg:flex" data-i18n-aria-label="header.nav.primary">
      <a href="index.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        <span data-i18n="common.home"></span>
      </a>
      <a href="services.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        <span data-i18n="header.nav.services"></span>
      </a>
      <a href="locations.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        <span data-i18n="header.nav.locations"></span>
      </a>
      <a href="contact.html" data-nav-link class="py-2 font-semibold hover:text-navy">
        <span data-i18n="header.nav.contact"></span>
      </a>
    </nav>

    <div class="flex shrink-0 items-center gap-2 justify-self-end sm:gap-3">
      <div class="flex shrink-0 rounded-md bg-[#eef3ff] p-1" role="group" data-i18n-aria-label="header.language.selection">
        <button type="button" class="min-h-8 rounded bg-navy px-2 text-xs font-bold text-white sm:px-3" data-i18n-aria-label="common.language.english" data-language="en" aria-pressed="true">
          EN
        </button>
        <button type="button" class="min-h-8 rounded px-2 text-xs font-bold text-slate-600 sm:px-3" data-i18n-aria-label="common.language.spanish" data-language="es" aria-pressed="false">
          ES
        </button>
      </div>

      <button
        type="button"
        id="menu-button"
        class="grid size-10 place-items-center rounded-md text-navy hover:bg-slate-100 lg:hidden"
        data-i18n-aria-label="header.menu.open"
        aria-controls="mobile-menu"
        aria-expanded="false"
      >
        <i data-lucide="menu" class="size-6" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <nav
    id="mobile-menu"
    class="hidden border-t border-slate-200 bg-white px-4 pb-4 pt-3 lg:hidden"
    data-i18n-aria-label="header.nav.mobile"
  >
    <div class="mx-auto flex max-w-7xl flex-col gap-1">
      <a href="index.html" data-nav-link class="rounded-md px-3 py-3 font-semibold hover:bg-cloud">
        <span data-i18n="common.home"></span>
      </a>
      <a href="services.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        <span data-i18n="header.nav.services"></span>
      </a>
      <a href="locations.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        <span data-i18n="header.nav.locations"></span>
      </a>
      <a href="contact.html" data-nav-link class="rounded-md px-3 py-3 font-medium hover:bg-cloud">
        <span data-i18n="header.nav.contact"></span>
      </a>
    </div>
  </nav>
</header>
